[package]
name = "jargonaut"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Define a command-line interface with JSON Schema: parsing, validation, defaults, help, and shell completion"
license = "MIT"
repository = "https://github.com/openbohemians/jargon.rs"
homepage = "https://jargon.openbohemians.org"
authors = ["Thomas Sawyer <transfire@gmail.com>"]
keywords = ["cli", "json-schema", "argument", "parser", "command-line"]
categories = ["command-line-interface"]

[dependencies]
fancy-regex = "0.19.2"
indexmap = "2.14.2"
serde = "1.0.229"
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
